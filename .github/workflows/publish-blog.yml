name: 部落格自動上架

# 什麼時候會自動跑：
# 1) 每天台灣時間早上 8 點、下午 1 點、晚上 8 點各檢查一次 Notion 有沒有新文章
# 2) 也可以到 GitHub 的 Actions 頁面手動點「Run workflow」立刻跑一次，不用等排程
on:
  schedule:
    - cron: "0 0,5,12 * * *" # UTC 時間，對應台灣時間 08:00 / 13:00 / 20:00
  workflow_dispatch: {}

# 讓這個自動化有權限把產生的檔案推回這個 repo
permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: 取得目前的網站程式碼
        uses: actions/checkout@v4

      - name: 準備 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 從 Notion 產生部落格文章頁面
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        run: node scripts/build-blog.mjs

      - name: 如果有新內容，就自動提交並推上 GitHub
        run: |
          git config user.name "mythrosy-blog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add blog/
          if git diff --cached --quiet; then
            echo "內容沒有變化，不需要提交。"
          else
            git commit -m "自動上架：更新部落格文章"
            git push
          fi
